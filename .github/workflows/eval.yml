name: eval

# Runs a retrieval experiment on real data and commits the results file back to the branch.
# Triggered by pushing a `results/**` branch (or manually). Results are only ever produced here or
# by a documented local run, never typed in by hand.
on:
  push:
    branches: ["results/**"]
    # Re-run only when code that affects results changes (docs edits must not churn results).
    paths: ["src/**", "scripts/**", "pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bm25:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[retrieval,data]"
      - name: Run BM25 baseline
        run: python scripts/run_bm25.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/m2_bm25.json
          if git diff --cached --quiet; then
            echo "No change in results."
          else
            git commit -m "results(m2): BM25 baseline on UIT-ViQuAD 2.0 from run ${{ github.run_id }}"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: m2-bm25-results
          path: results/
